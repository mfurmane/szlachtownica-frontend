<svg
  width="100%"
  height="90%"
  [attr.viewBox]="viewBox.x + ' ' + viewBox.y + ' ' + viewBox.w + ' ' + viewBox.h"
    (wheel)="onWheel($event)"
  (mousedown)="startPan($event)"
  (mousemove)="onPan($event)"
  (mouseup)="endPan()"
  (mouseleave)="endPan()"
>
  <g transform="scale(1,-1)">
    <ng-container *ngFor="let province of provinces">
      <ng-container *ngFor="let subprovince of province.subProvinces">
        <ng-container *ngFor="let region of subprovince.regions">
          <path
            [attr.d]="toPath(region.area)"
            [attr.fill]="getColor(region)"
            stroke="black"
            vector-effect="non-scaling-stroke"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
            (click)="onRegionClick(region, province)">
          </path>
        </ng-container>
      </ng-container>
    </ng-container>
  </g>
</svg>
