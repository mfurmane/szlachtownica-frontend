<div class="modes-overlay">
  <app-coloring-modes></app-coloring-modes>
</div>

<svg #map
  width="100%"
  height="90%"
  [attr.viewBox]="viewBox.x + ' ' + viewBox.y + ' ' + viewBox.w + ' ' + viewBox.h"
    (wheel)="onWheel($event)"
  (mousedown)="startPan($event)"
  (mousemove)="onMouseMove($event)"
  (mouseup)="endPan()"
  (mouseleave)="endPan()"
  (click)="onMapClick($event)"
>
  <g transform="scale(1,-1)" #mapG>
    @for (province of provinces; track province.id) {
      @for (subprovince of province.subProvinces; track subprovince.id) {
        @for (region of subprovince.regions; track region.id) {
          <path
            [attr.d]="paths.get(region.id)"
            [attr.fill]="getColor(region)"
            stroke="black"
            vector-effect="non-scaling-stroke"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
            (click)="onRegionClick(region, province)"
            (mouseenter)="onRegionEnter(region, province)"
            (mouseleave)="onElementLeave()">
          </path>
        }
      }
    }
    @if (provinceResults$ | async; as results) {
      @for (result of results; track result.identifier) {
        @if (result.province; as province) {
          <path class="search-hit"
            [attr.d]="provincePaths.get(province.id)"
            vector-effect="non-scaling-stroke"
            stroke-linejoin="round"
            stroke-linecap="round">
          </path>
        }
      }
    }
    @if (selectedRegion) {
      <path class="selected"
        [attr.d]="paths.get(selectedRegion.id)"
        vector-effect="non-scaling-stroke"
        stroke-linejoin="round"
        stroke-linecap="round">
      </path>
    }
    @for (extendedPlace of places; track extendedPlace.place.id) {
      <circle
        [attr.cx]="extendedPlace.place.location.coordinates[0]"
        [attr.cy]="extendedPlace.place.location.coordinates[1]"
        r="0.05"
        fill="red"
        stroke="black"
        vector-effect="non-scaling-stroke"
        stroke-width="2.4"
        (mouseenter)="onPlaceEnter(extendedPlace)"
        (mouseleave)="onElementLeave()"
        (click)="onPlaceClick(extendedPlace)"/>
    }
    @if (selectedPlace) {
      <circle class="selected"
        [attr.cx]="selectedPlace.location.coordinates[0]"
        [attr.cy]="selectedPlace.location.coordinates[1]"
        vector-effect="non-scaling-stroke"/>
    }
    @if (placeResults$ | async; as results) {
      @for (result of results; track result.identifier) {
        @if (result.place; as place) {
          <circle class="search-hit"
            [attr.cx]="place.place.location.coordinates[0]"
            [attr.cy]="place.place.location.coordinates[1]"
            vector-effect="non-scaling-stroke"/>
        }
      }
    }
  </g>
</svg>

<div class="legend-overlay">
  <app-legend></app-legend>
</div>

@if (hovered$ | async; as hovered) {
  <app-region-tooltip
    class="tooltip"
    [selection]="hovered"
    [characteristic]="currentColoring"
    [style.left.px]="cursorX + 8"
    [style.top.px]="cursorY + 8"
    />
}
