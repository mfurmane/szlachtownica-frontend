<h2><button (click)="toggleCollapse()" [attr.aria-expanded]="!collapsed">Legenda<span class="chevron" aria-hidden="true">{{ collapsed ? '▸' : '▾' }}</span></button></h2>

@if (!collapsed) {
  <div class="legend">
    @for (row of getLegend().rows; track row.value) {
        <button class="legend-row" [class.active]="row === highlighted" (click)="highlightCategory(row)"
          [attr.title]="row === highlighted ? 'Kliknij ponownie, aby wyłączyć' : undefined">
            <span class="swatch" [style.background-color]="palette()[currentColoring][row.value]"></span>
            {{ row.label }}
            @if (regionCounts.has(row)) {
              ({{ regionCounts.get(row) }})
            }
        </button>
    }
  </div>
}
