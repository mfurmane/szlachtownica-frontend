<h2><button (click)="toggleCollapse()" [attr.aria-expanded]="!collapsed">Legenda<span class="chevron" aria-hidden="true">{{ collapsed ? '▸' : '▾' }}</span></button></h2>

@if (!collapsed) {
  <div class="legend">
    @for (row of legend().rows; track row.value) {
        <button class="legend-row" [class.active]="row === highlightedCategory()" (click)="highlightCategory(row)"
          [attr.title]="row === highlightedCategory() ? 'Kliknij ponownie, aby wyłączyć' : undefined">
            <span class="swatch" [style.background-color]="palette()[currentColoring()][row.value]"></span>
            {{ row.label }}
            ({{ regionCounts().get(row) }})
        </button>
    }
  </div>
}
